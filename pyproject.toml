[project]
name = "the-corral"
version = "0.1.0"
description = "A TUI where twenty cheap 2024 Meta Llama 3.1 8B agents hold a group chat about a topic you type, and TypeSafe Jev conducts the room live."
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk>=0.7",
    "openai>=1.50",
    "rich>=13.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
